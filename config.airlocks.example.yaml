        object_name: "DOOR_N1051A"
        ajar_timer_tag: "Door_N1051A_Timer.DN"
        airlock: "N1051/N1054/N1055"
        description: "Door N1051A"
        invert_logic: true
        min_open_hold_ms: 5000
        debounce_ms: 50
