# Example configuration for the Sigma-Aldrich airlock PLC (RSLogix 5000 project
# SigmaAldrich.ACD), generated from the door-ajar timer rungs in the tag listing
# (8.pdf). Copy to config.yaml, set the real PLC IP, then run:
#
#   python -m sentinel --config config.yaml --plc-test    # verify tags/polarity
#   python -m sentinel --config config.yaml --log-only    # daily CSV event log only
#
# DOOR POLARITY: per the ladder logic (which takes precedence over the narrative PDF)
# each door-ajar TON runs on an XIO of the door input, so bit 0 = door OPEN and
# bit 1 = door CLOSED. That is invert_logic: true. Confirm every door with
# --plc-test by physically opening it.
#
# ajar_timer_tag is the PLC's 30 s door-ajar timer done bit; it is logged as
# DOOR-AJAR TIMER DONE when the door is left open past the preset.
#
# Not included: Local:8:I.Data.9 (Doors_N1034A_34B_37B) -- its logic is a plain
# XIC-to-output with no documented open/closed meaning.

service:
  poll_interval_ms: 500
  fault_threshold_polls: 3
  log_level: INFO

event_log:
  enabled: true
  # One file per day: airlock_events_YYYY-MM-DD.csv (opens directly in Excel).
  # "~" is the home folder of the user running sentinel (admin on the Pi).
  directory: "~/Desktop/AirlockLogs"
  file_prefix: "airlock_events"

# Only needed for the BACnet daemon (not for --log-only).
bacnet:
  device_id: 1001
  device_name: "AirlockSentinel-CR1"
  vendor_id: 999
  bind_address: "192.168.10.50/24:47808"

plcs:
  - id: plc1
    name: "SIGMA_ALDRICH"
    ip_address: "192.168.1.30"
    slot: 0
    timeout_sec: 2.0
    comm_ok_bacnet_instance: 900
